{% extends 'hoteles/base.html' %}

{% block title %}Eliminar habitación | LaManchaland{% endblock %}

{% block content %}

<div class="form-container">
    <h2>Eliminar habitación</h2>

    <p>
        ¿Estás seguro de que deseas eliminar la habitación
        <strong>{{ object.numero }}</strong>?
    </p>

    <form method="POST">
        {% csrf_token %}

        <div class="hotel-actions">
            <button type="submit" class="btn-desactivar">
                Confirmar eliminación
            </button>

            <a href="{% url 'gestion_hotel' object.hotel.pk %}" class="btn-volver">
                Cancelar
            </a>
        </div>
    </form>
</div>

{% endblock %}
