<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Historia No Escrita | LaManchaland</title>
    
    <style>
        /* ==========================================================
           RESET Y ESTILOS GLOBALES
           ========================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', 'Segoe UI', serif; /* Tipografía estilo gótico / clásico */
        }

        /* Fondo general de la página con estética LaManchaland (Rojo borgoña y negro) */
        body {
            background-color: #0d090a;
            /* Gradiente radial para dar efecto de luz central sobre fondo oscuro */
            background-image: 
                radial-gradient(circle at 50% 30%, #2b080c 0%, #0d090a 80%),
                repeating-linear-gradient(45deg, rgba(143, 23, 39, 0.05) 0px, rgba(143, 23, 39, 0.05) 20px, transparent 20px, transparent 40px);
            color: #e0d8d8;
            display: flex;
            align-items: center;    /* Centra la tarjeta de error verticalmente */
            justify-content: center; /* Centra la tarjeta de error horizontalmente */
            min-height: 100vh;
            padding: 1.5rem;
        }

        /* ==========================================================
           TARJETA CONTENEDORA DE ERROR
           ========================================================== */
        .error-card {
            background: rgba(23, 13, 16, 0.9);
            border: 1px solid #5c121b;
            border-top: 4px solid #8f1727; /* Detalle superior en rojo carmesí */
            border-radius: 8px;
            padding: 3rem 2rem;
            max-width: 550px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(143, 23, 39, 0.3);
        }

        /* ==========================================================
           MARCO CIRCULAR (AVATAR) DE DON QUIJOTE
           ========================================================== */
        .avatar-container {
            width: 130px;
            height: 130px;
            margin: 0 auto 1.5rem auto; /* Centra el círculo horizontalmente */
            border-radius: 50%;         /* Lo hace perfectamente circular */
            overflow: hidden;           /* Recorta la imagen sobrante fuera del círculo */
            border: 3px solid #d4af37;  /* Borde dorado */
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4), 0 0 25px rgba(143, 23, 39, 0.8);
            background-color: #1a080a;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ajuste de la imagen centrada dentro del contenedor */
        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;       /* Escala la imagen cubriendo todo el círculo sin deformarse */
            object-position: center; /* Centra la foto exactamente al medio */
        }

        /* ==========================================================
           TEXTOS Y NÚMERO DE ERROR
           ========================================================== */
        /* Estilo del "404" gigante */
        .error-code {
            font-size: 4rem;
            font-weight: bold;
            color: #e63946;
            text-shadow: 0 0 10px rgba(230, 57, 70, 0.6), 2px 2px 4px #000;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        /* Título principal de la historia */
        h1 {
            color: #f1c40f; /* Color dorado brillante */
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            border-bottom: 1px dashed #5c121b; /* Línea divisoria punteada */
            padding-bottom: 0.8rem;
        }

        /* Descripción del error */
        p {
            color: #b3a2a4;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* ==========================================================
           BOTÓN DE RETORNO
           ========================================================== */
        .btn-home {
            display: inline-block;
            background-color: #8f1727; /* Fondo rojo oscuro */
            color: #ffffff;
            padding: 0.8rem 1.8rem;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            border: 1px solid #d4af37; /* Borde dorado */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.9rem;
        }

        /* Efecto al pasar sobre el botón */
        .btn-home:hover {
            background-color: #b31e32;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
            transform: translateY(-2px); /* Eleva ligeramente el botón */
        }
    </style>
</head>
