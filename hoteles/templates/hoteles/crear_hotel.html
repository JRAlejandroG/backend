
{% extends 'hoteles/base.html' %}

{% block title %}Registrar Hotel | LaManchaland{% endblock %}

{% block content %}

<div class="card form-container">

    <h2>Registrar nuevo hotel</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn-home">
            Guardar hotel
        </button>
    </form>

    <a href="{% url 'lista_hoteles' %}" class="btn-home">
        Volver a la lista
    </a>

</div>

{% endblock %}
